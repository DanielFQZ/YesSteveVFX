plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.+'
}

version = mod_version
group = 'com.elfmcys.ysmvfx'
archivesBaseName = 'ysm-vfx'

def runningJava = JavaVersion.current().majorVersion.toInteger()
def compilerJava = runningJava >= 21 ? 21 : 17
java {
    // Forge 1.20.1 is a Java 17 target. A newer local JDK is also accepted
    // and is constrained to Java 17 bytecode below.
    toolchain.languageVersion = JavaLanguageVersion.of(compilerJava)
}

legacyForge {
    version = '1.20.1-47.4.16'

    parchment {
        mappingsVersion = '2023.09.03'
        minecraftVersion = '1.20.1'
    }

    mods {
        yesstevevfx {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            gameDirectory = project.file('run/client')
        }

        server {
            server()
            gameDirectory = project.file('run/server')
        }
    }
}

// ModDev's artifact task asks for a Java 17 executable. Use the same JDK that
// launched Gradle; Java 17 and newer are valid for this workspace, and the
// compile task below still emits Java 17 bytecode.
tasks.named('createMinecraftArtifacts') {
    def javaHome = System.getProperty('java.home')
    def javaExecutable = org.gradle.internal.os.OperatingSystem.current().isWindows()
            ? "${javaHome}/bin/java.exe"
            : "${javaHome}/bin/java"
    toolsJavaExecutable = file(javaExecutable).absolutePath
}

repositories {
    mavenCentral()
}

def ysmJarPath = providers.gradleProperty('ysmJar').orNull
def eyelibJarPath = providers.gradleProperty('eyelibJar').orNull

sourceSets {
    ysm
    eyelib
}

dependencies {
    // YSM and eyelib integrations are isolated source sets. The core remains
    // buildable without either optional mod; pass -PysmJar/-PeyelibJar to
    // compile and package the corresponding bridge.
    if (ysmJarPath != null) {
        ysmCompileOnly files(ysmJarPath)
        ysmAnnotationProcessor files(ysmJarPath)
        ysmCompileOnly sourceSets.main.output
        sourceSets.ysm.compileClasspath += sourceSets.main.output + configurations.compileClasspath
    }
    if (eyelibJarPath != null) {
        eyelibCompileOnly files(eyelibJarPath)
        eyelibCompileOnly sourceSets.main.output
        sourceSets.eyelib.compileClasspath += sourceSets.main.output + configurations.compileClasspath
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.google.code.gson:gson:2.10.1'
}

if (ysmJarPath != null) {
    tasks.named('compileYsmJava') {
        dependsOn tasks.named('classes')
        options.release = 17
        options.encoding = 'UTF-8'
    }
    tasks.named('jar') {
        dependsOn tasks.named('compileYsmJava')
        from sourceSets.ysm.output
    }
}

if (eyelibJarPath != null) {
    tasks.named('compileEyelibJava') {
        dependsOn tasks.named('classes')
        options.release = 17
        options.encoding = 'UTF-8'
    }
    tasks.named('jar') {
        dependsOn tasks.named('compileEyelibJava')
        from sourceSets.eyelib.output
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}
